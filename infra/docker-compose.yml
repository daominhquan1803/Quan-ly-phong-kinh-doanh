name: hoanggia-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-hoanggia}/hoanggia-web:latest
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
      WORKER_INTERNAL_URL: http://worker:4001
    volumes:
      - web_uploads:/app/apps/web/public/uploads
    expose:
      - "3000"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-hoanggia}/hoanggia-worker:latest
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WORKER_PORT: 4001
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
      HIENVI_BASE_URL: ${HIENVI_BASE_URL:-https://congno.hienvi.me}
      HIENVI_USERNAME: ${HIENVI_USERNAME}
      HIENVI_PASSWORD: ${HIENVI_PASSWORD}
      HIENVI_MOCK_MODE: ${HIENVI_MOCK_MODE:-false}
      HIENVI_SYNC_CRON: ${HIENVI_SYNC_CRON:-30 6 * * *}
    volumes:
      - worker_debug:/app/debug
    expose:
      - "4001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  web_uploads:
  worker_debug:
  certbot_www:
  certbot_certs:
