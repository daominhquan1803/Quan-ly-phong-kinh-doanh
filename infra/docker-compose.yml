name: hoanggia-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-hoanggia}/hoanggia-web:latest
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
      WORKER_INTERNAL_URL: http://worker:4001
      # Thông báo đẩy (Web Push) — web chỉ cần khoá CÔNG KHAI để trả cho trình duyệt đăng ký,
      # khoá riêng tư chỉ worker (nơi thực sự gửi push) mới cần.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    volumes:
      - web_uploads:/app/apps/web/public/uploads
    expose:
      - "3000"
    # Nhãn Traefik — vô hại nếu VPS không có Traefik (không dùng profile
    # standalone-tls thì không cần quan tâm); dùng khi VPS đã có sẵn Traefik
    # riêng (vd template "Docker and Traefik" của Hostinger) làm reverse
    # proxy + tự cấp HTTPS, thay cho nginx+certbot tự quản lý bên dưới.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hoanggia-web.rule=Host(`${DOMAIN:-kinhdoanh.hoanggiaps.vn}`)"
      - "traefik.http.routers.hoanggia-web.entrypoints=websecure"
      - "traefik.http.routers.hoanggia-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.hoanggia-web.loadbalancer.server.port=3000"
      # Router thứ 2 — truy cập trực tiếp bằng hostname VPS Hostinger cấp sẵn
      # (vd srv1917023.hstgr.cloud), song song với domain riêng ở trên. Đặt
      # EXTRA_DOMAIN="" trong .env nếu muốn tắt hẳn route này.
      - "traefik.http.routers.hoanggia-web-alt.rule=Host(`${EXTRA_DOMAIN:-srv1917023.hstgr.cloud}`)"
      - "traefik.http.routers.hoanggia-web-alt.entrypoints=websecure"
      - "traefik.http.routers.hoanggia-web-alt.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hoanggia-web-alt.service=hoanggia-web"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-hoanggia}/hoanggia-worker:latest
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WORKER_PORT: 4001
      INTERNAL_SYNC_TOKEN: ${INTERNAL_SYNC_TOKEN}
      AMIS_APP_ID: ${AMIS_APP_ID}
      AMIS_CLIENT_SECRET: ${AMIS_CLIENT_SECRET}
      AMIS_SYNC_CRON: ${AMIS_SYNC_CRON:-0 6 * * *}
      AMIS_SYNC_CRON_TIMEZONE: ${AMIS_SYNC_CRON_TIMEZONE:-Asia/Ho_Chi_Minh}
      HIENVI_BASE_URL: ${HIENVI_BASE_URL:-https://congno.hienvi.me}
      HIENVI_USERNAME: ${HIENVI_USERNAME}
      HIENVI_PASSWORD: ${HIENVI_PASSWORD}
      HIENVI_MOCK_MODE: ${HIENVI_MOCK_MODE:-false}
      HIENVI_SYNC_ENABLED: ${HIENVI_SYNC_ENABLED:-true}
      HIENVI_SYNC_CRON: ${HIENVI_SYNC_CRON:-30 6 * * *}
      GOOGLE_SHEETS_QUOTE_ID: ${GOOGLE_SHEETS_QUOTE_ID}
      QUOTE_SYNC_CRON: ${QUOTE_SYNC_CRON:-15 6 * * *}
      QUOTE_SYNC_CRON_TIMEZONE: ${QUOTE_SYNC_CRON_TIMEZONE:-Asia/Ho_Chi_Minh}
      # Thông báo nhắc việc (Kế hoạch tuần sắp hết hạn + KPI tháng chậm tiến độ) — worker gọi
      # ngược lại vào web để lấy số liệu (chiều ngược với WORKER_INTERNAL_URL ở service web).
      WEB_INTERNAL_URL: http://web:3000
      NOTIFY_CRON: ${NOTIFY_CRON:-0 8 * * *}
      NOTIFY_CRON_TIMEZONE: ${NOTIFY_CRON_TIMEZONE:-Asia/Ho_Chi_Minh}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Hoàng Gia CRM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sale5.hoanggiaps@gmail.com}
    volumes:
      - worker_debug:/app/debug
    expose:
      - "4001"

  # Chỉ chạy 2 service dưới đây khi VPS CHƯA có sẵn reverse proxy nào khác:
  #   docker compose --profile standalone-tls up -d --build
  # Nếu VPS đã có Traefik riêng (vd template có sẵn của nhà cung cấp VPS),
  # KHÔNG bật profile này — chỉ cần "docker compose up -d --build" là đủ,
  # nhãn Traefik ở service web bên trên sẽ tự được nhận diện.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["standalone-tls"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles: ["standalone-tls"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  web_uploads:
  worker_debug:
  certbot_www:
  certbot_certs:
