name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Prisma cần biến này tồn tại để validate/generate schema — không cần DB thật kết nối được.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate --schema packages/db/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Type-check (web)
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Type-check (worker)
        run: npx tsc --noEmit --project apps/worker/tsconfig.json

      - name: Unit tests
        run: npm run test --workspace=apps/web
