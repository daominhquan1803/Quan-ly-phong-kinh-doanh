name: Deploy to Hostinger VPS

# Kích hoạt thủ công (nút "Run workflow" trên GitHub) — bật thêm trigger `push` khi đã
# sẵn sàng deploy tự động mỗi lần merge vào main. Cần khai báo trước các repo secrets:
# VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH (đường dẫn infra/ trên VPS).
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hoanggia-web:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hoanggia-worker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
            docker compose exec -T web npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
