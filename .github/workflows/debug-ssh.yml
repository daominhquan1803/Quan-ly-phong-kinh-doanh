name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== docker compose ps ====="
            docker compose ps
            echo "===== web logs (last 300) ====="
            docker compose logs web --tail 300
            echo "===== recent PoTrackingImportBatch ====="
            docker compose exec -T worker node -e "const {prisma}=require('/repo/packages/db/dist/index.js'); prisma.poTrackingImportBatch.findMany({orderBy:{createdAt:'desc'},take:5}).then(r=>{console.log(JSON.stringify(r,null,2));return prisma.\$disconnect();})"
