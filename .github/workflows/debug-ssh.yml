name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== lines with >3 file-sourced delivery events (duplicate suspects) ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const groups = await prisma.poDeliveryEvent.groupBy({
                by: ['lineId'],
                where: { sourceShipmentSlipId: null },
                _count: true,
                _sum: { value: true },
                having: { lineId: { _count: { gt: 3 } } },
                orderBy: { _count: { lineId: 'desc' } },
                take: 20,
              });
              console.log('Duplicate-suspect lines:', JSON.stringify(groups, (k,v)=>typeof v==='bigint'?v.toString():v, 2));
              const total = await prisma.poDeliveryEvent.aggregate({ where: { sourceShipmentSlipId: null }, _sum: { value: true }, _count: true });
              console.log('TOTAL file-sourced events:', JSON.stringify(total, (k,v)=>typeof v==='bigint'?v.toString():v));
              await prisma.\$disconnect();
            })();
            "
