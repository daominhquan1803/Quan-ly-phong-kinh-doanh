name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== Users: notifyEmail + push subscription status ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const users = await prisma.user.findMany({
                where: { role: 'SALES', active: true },
                select: { id: true, name: true, notifyEmail: true, email: true },
              });
              const subs = await prisma.pushSubscription.findMany({ select: { userId: true } });
              const subUserIds = new Set(subs.map(s => s.userId));
              for (const u of users) {
                console.log(u.name, '| notifyEmail:', u.notifyEmail || '(trong)', '| co push:', subUserIds.has(u.id));
              }
              await prisma.\$disconnect();
            })();
            "
