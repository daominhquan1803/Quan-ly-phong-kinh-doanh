name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== Sept 2026 PoDeliveryEvent, split baseline(Excel) vs slip(Phieu di hang), per employee ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const events = await prisma.poDeliveryEvent.findMany({
                where: { eventDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) } },
                select: { value: true, salesEmployeeId: true, sourceShipmentSlipId: true, salesEmployee: { select: { name: true, amisEmployeeCode: true } } },
              });
              const byEmp = new Map();
              for (const e of events) {
                const name = e.salesEmployee?.amisEmployeeCode || e.salesEmployeeId || 'null';
                if (!byEmp.has(name)) byEmp.set(name, { baseline: 0, slip: 0, baselineCount: 0, slipCount: 0 });
                const b = byEmp.get(name);
                if (e.sourceShipmentSlipId) { b.slip += Number(e.value); b.slipCount++; }
                else { b.baseline += Number(e.value); b.baselineCount++; }
              }
              for (const [name, v] of byEmp) {
                console.log(name, 'baseline=', v.baseline, '('+v.baselineCount+' events)', 'slip=', v.slip, '('+v.slipCount+' events)', 'total=', v.baseline+v.slip);
              }
              await prisma.\$disconnect();
            })();
            "
