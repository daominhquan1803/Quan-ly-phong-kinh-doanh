name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== Backfill Customer.salesEmployeeId tu file Danh sach khach hang (chi cap nhat dong con null) ====="
            docker compose exec -T worker node -e "
            const {prisma, resolveEmployeeIdByName}=require('/repo/packages/db/dist/index.js');
            const B64='';
            (async () => {
              const entries = JSON.parse(Buffer.from(B64, 'base64').toString('utf8'));
              console.log('Tong dong co NVKD trong file:', entries.length);
              let updated=0, notFoundCustomer=0, employeeNotResolved=0, alreadySet=0;
              const notResolvedNames = new Set();
              for (const [code, empName] of entries) {
                const customer = await prisma.customer.findUnique({ where: { customerCode: code } });
                if (!customer) { notFoundCustomer++; continue; }
                if (customer.salesEmployeeId) { alreadySet++; continue; }
                const empId = await resolveEmployeeIdByName(empName);
                if (!empId) { employeeNotResolved++; notResolvedNames.add(empName); continue; }
                await prisma.customer.update({ where: { id: customer.id }, data: { salesEmployeeId: empId } });
                updated++;
              }
              console.log('Da cap nhat:', updated);
              console.log('Da co san tu truoc (bo qua):', alreadySet);
              console.log('Khong tim thay khach hang:', notFoundCustomer);
              console.log('Khong resolve duoc ten NVKD:', employeeNotResolved, Array.from(notResolvedNames));
              await prisma.\$disconnect();
            })();
            "