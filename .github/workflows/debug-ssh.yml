name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== Sept 2026 flagged groups: full line detail (qty/price/date) ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const events = await prisma.poDeliveryEvent.findMany({
                where: { eventDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) } },
                select: { value: true, lineId: true, line: { select: { poCode: true, itemName: true, itemCode: true, nvkdCodeRaw: true, poQuantity: true, contractPrice: true, requestedDeliveryDate: true, poDate: true, deliveredValue: true, naturalKey: true } } },
              });
              const byKey = new Map();
              for (const e of events) {
                const key = e.line.poCode + '::' + e.line.itemName;
                if (!byKey.has(key)) byKey.set(key, new Map());
                const m = byKey.get(key);
                if (!m.has(e.lineId)) m.set(e.lineId, { sum: 0, line: e.line });
                m.get(e.lineId).sum += Number(e.value);
              }
              const flagged = [];
              for (const [key, lineMap] of byKey) {
                if (lineMap.size < 2) continue;
                flagged.push({
                  key,
                  lines: Array.from(lineMap.entries()).map(([id, v]) => ({
                    id, naturalKey: v.line.naturalKey, sum: v.sum,
                    itemCode: v.line.itemCode, nvkd: v.line.nvkdCodeRaw,
                    qty: v.line.poQuantity, price: v.line.contractPrice,
                    reqDate: v.line.requestedDeliveryDate, poDate: v.line.poDate,
                    deliveredValue: v.line.deliveredValue,
                  })),
                });
              }
              console.log('Flagged groups:', flagged.length);
              console.log(JSON.stringify(flagged, null, 2));
              await prisma.\$disconnect();
            })();
            "
