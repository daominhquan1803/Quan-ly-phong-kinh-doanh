name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== PO tracking import batches ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const batches = await prisma.poTrackingImportBatch.findMany({ orderBy: { createdAt: 'asc' }, select: { id: true, fileName: true, createdAt: true, totalRows: true, createdCount: true, updatedCount: true } });
              for (const b of batches) console.log(b.createdAt.toISOString(), b.fileName, 'rows=', b.totalRows, 'created=', b.createdCount, 'updated=', b.updatedCount);
              console.log('===== Sept 2026 baseline vs slip per employee =====');
              const users = await prisma.user.findMany({ select: { id: true, amisEmployeeCode: true } });
              const codeById = new Map(users.map(u => [u.id, u.amisEmployeeCode]));
              const events = await prisma.poDeliveryEvent.findMany({
                where: { eventDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) } },
                select: { value: true, salesEmployeeId: true, sourceShipmentSlipId: true },
              });
              const byEmp = new Map();
              for (const e of events) {
                const name = (e.salesEmployeeId && codeById.get(e.salesEmployeeId)) || e.salesEmployeeId || 'null';
                if (!byEmp.has(name)) byEmp.set(name, { baseline: 0, slip: 0 });
                const b = byEmp.get(name);
                if (e.sourceShipmentSlipId) b.slip += Number(e.value); else b.baseline += Number(e.value);
              }
              for (const [name, v] of byEmp) console.log(name, 'baseline=', v.baseline.toLocaleString('vi-VN'), 'slip=', v.slip.toLocaleString('vi-VN'), 'total=', (v.baseline+v.slip).toLocaleString('vi-VN'));
              console.log('===== Shipment slips Sept range =====');
              const slips = await prisma.shipmentSlip.findMany({ where: { slipDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) } }, select: { slipDate: true }, orderBy: { slipDate: 'asc' } });
              console.log('count=', slips.length, slips.length? ('first='+slips[0].slipDate.toISOString()+' last='+slips[slips.length-1].slipDate.toISOString()) : '');
              await prisma.\$disconnect();
            })();
            "
