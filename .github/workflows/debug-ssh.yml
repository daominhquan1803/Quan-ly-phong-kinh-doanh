name: Debug SSH (temporary)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "apply (true) = ghi that, false = dry-run"
        required: true
        default: "false"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose exec -T -e TZ=Asia/Ho_Chi_Minh worker npx tsx /repo/scripts/sync-customer-payment-terms.ts ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}
