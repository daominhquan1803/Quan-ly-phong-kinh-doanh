name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== Sept 2026 doanh so theo nhan vien sau khi sua lai ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const users = await prisma.user.findMany({ select: { id: true, amisEmployeeCode: true } });
              const codeById = new Map(users.map(u => [u.id, u.amisEmployeeCode]));
              const rows = await prisma.poDeliveryEvent.groupBy({
                by: ['salesEmployeeId'],
                where: { eventDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) }, salesEmployeeId: { not: null } },
                _sum: { value: true },
              });
              let total = 0;
              for (const r of rows) {
                const v = Number(r._sum.value ?? 0);
                total += v;
                console.log(codeById.get(r.salesEmployeeId) || r.salesEmployeeId, v.toLocaleString('vi-VN'));
              }
              console.log('TONG:', total.toLocaleString('vi-VN'));
              await prisma.\$disconnect();
            })();
            "
