name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose exec -T -e TZ=Asia/Ho_Chi_Minh worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const es = await prisma.weekPlanResultEntry.findMany({ where: { weekStart: { gte: new Date(2026,8,1), lt: new Date(2026,8,14) } }, include: { employee: { select: { name: true } } } });
              const g = {};
              for (const e of es) { const k = e.employee.name + ' | ' + e.metric + ' | ' + e.entryDate.getDate() + '/' + (e.entryDate.getMonth()+1); g[k] = (g[k]||0)+1; }
              console.log('Tuan 1 thang 9 - so dong theo NV/muc/ngay:'); console.log(JSON.stringify(g, null, 1));
              const totals = {};
              for (const e of es) { const k = e.employee.name + ' | ' + e.metric; totals[k] = (totals[k]||0)+1; }
              console.log('Tong:', JSON.stringify(totals, null, 1));
              await prisma.\$disconnect();
            })();
            "
