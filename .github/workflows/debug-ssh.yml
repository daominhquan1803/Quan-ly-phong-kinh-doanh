name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "===== PO tracking import batches (baseline uploads) ====="
            docker compose exec -T worker node -e "
            const {prisma}=require('/repo/packages/db/dist/index.js');
            (async () => {
              const batches = await prisma.poTrackingImportBatch.findMany({ orderBy: { createdAt: 'asc' }, select: { id: true, fileName: true, createdAt: true, completedAt: true, totalRows: true, createdCount: true, updatedCount: true, createdBy: { select: { name: true, email: true } } } });
              console.log('Import batches:', batches.length);
              for (const b of batches) console.log(b.createdAt.toISOString(), b.fileName, 'rows=', b.totalRows, 'created=', b.createdCount, 'updated=', b.updatedCount, 'by=', b.createdBy?.name, b.createdBy?.email);
              console.log('===== Shipment slips (Phieu di hang) date range in Sept 2026 =====');
              const slips = await prisma.shipmentSlip.findMany({ where: { slipDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) } }, select: { id: true, slipDate: true, createdAt: true } , orderBy: { slipDate: 'asc' }});
              console.log('Sept slips:', slips.length);
              if (slips.length) console.log('first=', slips[0].slipDate.toISOString(), 'last=', slips[slips.length-1].slipDate.toISOString());
              console.log('===== Sample baseline-sourced Sept events: eventDate vs their line importBatchId createdAt =====');
              const sample = await prisma.poDeliveryEvent.findMany({
                where: { eventDate: { gte: new Date(2026,8,1), lt: new Date(2026,9,1) }, sourceShipmentSlipId: null },
                select: { eventDate: true, value: true, line: { select: { poCode: true, itemCode: true, importBatchId: true, importBatch: { select: { createdAt: true, fileName: true } } } } },
                take: 10,
              });
              for (const s of sample) console.log('eventDate=', s.eventDate.toISOString(), 'value=', s.value, 'poCode=', s.line.poCode, 'batchCreatedAt=', s.line.importBatch?.createdAt?.toISOString(), 'file=', s.line.importBatch?.fileName);
              await prisma.\$disconnect();
            })();
            "
