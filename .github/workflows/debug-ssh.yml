name: Debug SSH (temporary)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "ten file trong scripts/ (khong co .ts)"
        required: true
        default: "inspect-po-metrics"
      args:
        description: "tham so them cho script"
        required: false
        default: ""

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose exec -T -e TZ=Asia/Ho_Chi_Minh worker npx tsx /repo/scripts/${{ github.event.inputs.script }}.ts ${{ github.event.inputs.args }}
